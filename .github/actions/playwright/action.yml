name: Playwright-Browser
description: Chromium (nur Headless-Shell) mit Cache je Playwright-Version, dazu die Systempakete.
# lean: nur Chromium. Für T-306 (Suite `datei` auch in Firefox) braucht die
# Action einen Browser-Parameter, und der Cache-Key muss den Browser nennen.
runs:
  using: composite
  steps:
    - name: Playwright-Version ermitteln
      id: version
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-shell
    # Die Systempakete liegen nicht im Cache, sie kommen bei jedem Lauf per apt.
    # Der Browser-Download entfällt bei einem Cache-Treffer.
    - name: Chromium-Headless-Shell installieren
      shell: bash
      run: pnpm exec playwright install --with-deps --only-shell chromium
