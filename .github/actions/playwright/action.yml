name: Playwright-Browser
description: Chromium (nur Headless-Shell), mit `alle` auch Firefox und WebKit. Cache je Playwright-Version und Browser-Satz, dazu die Systempakete.
inputs:
  alle:
    description: '"true" installiert zusätzlich Firefox und WebKit (Suite `datei`).'
    default: "false"
runs:
  using: composite
  steps:
    - name: Playwright-Version ermitteln
      id: version
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ inputs.alle == 'true' && 'drei' || 'shell' }}
    # Die Systempakete (auch für WebKit) liegen nicht im Cache, sie kommen bei
    # jedem Lauf per apt. Der Browser-Download entfällt bei einem Cache-Treffer.
    - name: Browser installieren
      shell: bash
      env:
        BROWSER: ${{ inputs.alle == 'true' && 'chromium firefox webkit' || 'chromium' }}
      # $BROWSER absichtlich ungequotet: Liste mit Leerzeichen.
      run: pnpm exec playwright install --with-deps --only-shell $BROWSER
