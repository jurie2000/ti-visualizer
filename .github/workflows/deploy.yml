name: Deploy

# Stufen 1 bis 5 wie in ci.yml, danach Stufe 6 (plan.md, „CI/CD-Pipeline“).
# Auf `main` übernimmt dieser Workflow die Prüfung; ci.yml läuft dort nicht.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Ein Deployment nach dem anderen, laufende werden nie abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: deploy
    needs: pipeline
    # Manuell gestartet von einem anderen Branch: kein Deployment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nur hier werden Schreibrechte für Pages vergeben.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Das geprüfte Artefakt aus Stufe 4, nicht neu gebaut.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - name: Smoke-Test gegen die öffentliche Adresse
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        # Abschließender „/“ nötig, damit relative Pfade unter /ti-visualizer/ bleiben.
        run: |
          E2E_BASE_URL="${PAGE_URL%/}/" pnpm exec playwright test --project smoke
      - name: Bericht, Trace und Video bei Fehlern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-fehler-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
