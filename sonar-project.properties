sonar.organization=jurie2000
sonar.projectKey=jurie2000_ti-visualizer
sonar.projectName=TI Visualizer
sonar.sourceEncoding=UTF-8

# Quell- und Testdateien müssen getrennte Mengen sein.
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/test/**,tests/**

# Einstiegspunkt ohne Logik, wie in vitest.config.ts von der Abdeckung ausgenommen.
sonar.coverage.exclusions=src/main.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
